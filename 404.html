<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="页面不存在。">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%233a5a8c'/%3E%3Cpath%20d='M11%2023L21%209'%20stroke='%23f7f6f3'%20stroke-width='3'%20stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151518" media="(prefers-color-scheme: dark)">
<title>404 · 隙间</title>
<style>
  :root{
    --bg:#f7f6f3;
    --fg:#1b1b1b;
    --muted:#87837b;
    --line:#e7e3db;
    --accent:#3a5a8c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#151518;
      --fg:#e8e6e1;
      --muted:#8a8984;
      --line:#2b2b32;
      --accent:#8fb0dd;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  main{padding:48px 24px;max-width:560px;}
  .code{
    margin:0;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12px;letter-spacing:.14em;color:var(--muted);
  }
  .num{
    margin:8px 0 0;
    font-size:clamp(72px,20vw,132px);
    font-weight:650;
    letter-spacing:.02em;
    line-height:1;
  }
  .msg{margin:18px 0 0;font-size:16px;}
  .joke{
    margin:6px 0 0;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12.5px;color:var(--muted);
  }
  .back{
    display:inline-block;
    margin-top:32px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13px;color:var(--accent);
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:border-color .2s ease;
  }
  .back:hover{border-bottom-color:var(--accent);}
  hr{border:0;border-top:1px solid var(--line);margin:28px 0 0;}
</style>
</head>
<body>
  <main>
    <p class="code">HTTP 404</p>
    <p class="num">404</p>
    <p class="msg">这里没有你要找的东西。</p>
    <p class="joke">// 不过按 418 的说法，我是一把茶壶。</p>
    <hr>
    <a class="back" href="/">← 回工坊</a>
  </main>
</body>
</html>
